[workspace]
members = [
    "crates/aurguard-core",
    "crates/aurguard-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/M3rsy/aurguard"
rust-version = "1.75"
authors = ["Gian Carlo Holmes Ortez (@M3rsy)", "AURGuard contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
