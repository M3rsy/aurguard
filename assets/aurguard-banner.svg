  <text x="318" y="235" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="600">Scan before you build.</text>
  <text x="318" y="292" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Static security analysis for Arch User Repository packages</text>
