<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AURGuard</title>
  <desc id="desc">A shield protecting a package, with the tagline Scan before you build.</desc>
